name: coding-accuracy-lab   # fixed project name, so the data volume doesn't depend on the folder name

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: charta
      POSTGRES_PASSWORD: charta
      POSTGRES_DB: charta
    ports:
      - "5433:5432"   # host 5433 -> container 5432, avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  pgdata:
